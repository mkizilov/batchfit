[build-system]
requires = ["scikit-build-core==0.11.6", "pybind11==3.0.1", "cmake==3.31.6", "ninja==1.11.1.3"]
build-backend = "scikit_build_core.build"

[project]
name = "batchfit"
version = "0.1.0"
description = "Batched spectral fitting with C++ CPU and Apple Metal backends"
requires-python = ">=3.9,<3.13"
dependencies = ["numpy==2.0.2"]

[project.optional-dependencies]
benchmark = ["scipy==1.13.1", "matplotlib==3.9.4"]
dev = [
    "uv==0.9.8",
    "cmake==3.31.6",
    "ninja==1.11.1.3",
    "clang-format==18.1.8",
    "clang-tidy==21.1.6",
    "pytest==8.4.2",
    "scipy==1.13.1",
    "matplotlib==3.9.4",
    "pybind11==3.0.1",
    "scikit-build-core==0.11.6",
]

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/python/{wheel_tag}"
wheel.packages = ["python/batchfit"]
build.targets = ["_core"]
build.tool-args = ["-j2"]

[tool.scikit-build.cmake.define]
BATCHFIT_BUILD_PYTHON = "ON"
BATCHFIT_BUILD_TESTS = "OFF"
BATCHFIT_BUILD_BENCHMARKS = "OFF"

[tool.pytest.ini_options]
testpaths = ["python/tests"]
addopts = "-ra -p no:cacheprovider"
